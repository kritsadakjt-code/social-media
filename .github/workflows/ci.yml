name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs: # run unit test ก่อนเพราะเร็วพังจะได้ไม่เสียเวลารันนาน
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # copy code จาก github ไปไว้ที่ ubuntu
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx jest --testPathIgnorePatterns="e2e-spec|integration"

  e2e-and-integration:
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Integration tests
        run: npx jest --testPathPatterns="integration"
      - name: E2E tests
        run: npm run test:e2e
